server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name thantzinmin.cloud www.thantzinmin.cloud;

    ssl_certificate /etc/letsencrypt/live/thantzinmin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thantzinmin.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/thantzinmin.cloud;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests; block-all-mixed-content" always;
}

server {
    listen 80;
    listen [::]:80;

    server_name thantzinmin.cloud www.thantzinmin.cloud;

    return 301 https://$host$request_uri;
}
